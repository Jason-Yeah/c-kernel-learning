<style>
:root{color-scheme:dark;--bg:#0c1323;--panel:#151f33;--line:#33435f;--text:#e6edf8;--muted:#a5b4ce;--blue:#69b6ff;--green:#63ddad;--orange:#ffc078;--purple:#bc9aff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1240px;margin:auto;padding:28px 22px}h1{font-size:clamp(24px,4vw,36px);margin:0}h2{font-size:20px;margin:0 0 12px}p{margin:8px 0}.muted,small{color:var(--muted)}nav,.controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}button,select{font:inherit;color:var(--text);background:#21304b;border:1px solid #405474;border-radius:9px;padding:8px 16px;cursor:pointer}button:hover{border-color:var(--blue)}button[aria-selected=true]{background:#244d77;border-color:var(--blue)}button:disabled{opacity:.4;cursor:default}.controls{align-items:center;margin:14px 0}.controls .count{margin-left:auto;font-variant-numeric:tabular-nums}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px}.diagram{min-height:520px}.cpu{border:2px solid var(--blue);border-radius:12px;padding:13px 18px;background:#142d48;min-height:85px;margin-bottom:14px;transition:background .4s}.cpu strong{color:var(--blue)}.cpu.idle{border-style:dashed;background:#182237}.cpu .reg{font:14px/1.6 ui-monospace,monospace;color:#c1dcff}.memory{display:grid;grid-template-columns:1fr 1fr;gap:14px}.process{border:2px solid #49648a;border-radius:12px;padding:12px;transition:all .4s}.process.active{border-color:var(--blue);box-shadow:0 0 24px #69b6ff20}.process h3{font-size:17px;margin:0 0 10px}.address{font:12px ui-monospace,monospace;color:var(--muted);margin-bottom:8px}.block{border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:8px 0;background:#101a2d;transition:background .4s,border-color .4s,transform .4s}.block.hot{background:#233c50;border-color:var(--green);transform:translateY(-2px)}.block strong{display:block;font-size:14px}.value{font:14px/1.6 ui-monospace,monospace;color:var(--green);white-space:pre-wrap}.thread-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.thread{border:1px solid #656290;border-radius:10px;padding:10px;margin-top:10px;transition:all .4s}.thread.running{border-color:var(--green);background:#173c35;box-shadow:0 0 18px #63ddad18}.thread.waiting{border-style:dashed;opacity:.8}.thread h4{margin:0 0 5px;font-size:15px}.badge{display:inline-block;border-radius:5px;background:#283651;padding:1px 7px;font-size:12px;color:#d4dcf0}.frame{border:2px solid #73618e;border-radius:9px;padding:10px;min-height:130px;transition:all .45s}.frame.active{border-color:var(--green);background:#193b36;transform:translateY(-3px)}.frame.gone{opacity:.3;border-style:dashed}.frame h4{margin:0 0 6px;font-size:15px;color:var(--purple)}.frames{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}.arrow{color:var(--orange);font-size:14px;min-height:30px;text-align:center;margin:6px 0}.callstack{min-height:70px;font:14px/1.7 ui-monospace,monospace;color:#c9e2ff}.explain{border-left:4px solid var(--green);padding:8px 0 8px 14px;min-height:155px}.explain h2{color:var(--green)}.code{font:13px/1.9 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#0d1729;padding:12px;border-radius:9px}.code .current{display:block;background:#29473e;color:#a2ffd6;margin:0 -6px;padding:0 6px;border-left:3px solid var(--green)}.code .line{display:block}aside section+section{margin-top:18px}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:14px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--green)}.dot.blue{background:var(--blue)}.dot.purple{background:var(--purple)}.note{background:#251f31;border:1px solid #615071;border-radius:10px;padding:13px;margin-top:18px;font-size:14px}.timeline{display:flex;gap:5px;margin:14px 0}.tick{height:7px;flex:1;background:#2c3b56;border:0;border-radius:5px;padding:0}.tick.past{background:#4d8b83}.tick.now{background:var(--green)}table{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}td,th{text-align:left;border-bottom:1px solid var(--line);padding:9px}footer{color:var(--muted);font-size:13px;margin:20px 0}kbd{background:#26334c;border-radius:4px;padding:1px 6px}@media(max-width:900px){.layout{grid-template-columns:1fr}.diagram{min-height:0}}@media(max-width:550px){main{padding:18px 12px}.memory,.thread-row,.frames{grid-template-columns:1fr}.controls .count{margin-left:0}.card{padding:13px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><main>
<h1>看见执行：进程、线程与协程</h1>
<p class="muted">从“内存放在哪里”到“CPU 下一步执行什么”。无需联网，点击下一步就能跟着走。</p>
<nav aria-label="选择演示"><button data-mode="process" aria-selected="true">① 进程：独立地址空间</button><button data-mode="thread" aria-selected="false">② 线程：共享内存与切换</button><button data-mode="coroutine" aria-selected="false">③ 协程：帧、挂起与恢复</button></nav>
<div class="controls"><button id="prev">← 上一步</button><button id="play">▶ 自动播放</button><button id="next">下一步 →</button><button id="reset">重置</button><label>速度 <select id="speed"><option value="3200">慢</option><option value="2200" selected>正常</option><option value="1100">快</option></select></label><span id="count" class="count"></span></div>
<div id="timeline" class="timeline" aria-label="执行进度"></div>
<div class="layout"><section class="card diagram" aria-label="内存与执行示意"><div id="visual"></div><div class="legend"><span><i class="dot blue"></i>CPU / 当前进程</span><span><i class="dot"></i>当前执行或访问</span><span><i class="dot purple"></i>保留的协程状态</span></div></section>
<aside><section class="card"><div id="explain" class="explain" aria-live="polite"></div></section><section class="card"><h2>跟着代码看</h2><div id="code" class="code"></div></section></aside></div>
<div id="note" class="note"></div>
<section class="card" style="margin-top:18px"><h2>三个层次，不是三种互相替代的东西</h2><table><thead><tr><th>概念</th><th>主要管理什么</th><th>执行靠谁</th></tr></thead><tbody><tr><td>进程</td><td>地址空间、文件等资源与隔离</td><td>至少一个线程</td></tr><tr><td>线程</td><td>执行栈、寄存器现场、调度状态</td><td>OS 调度到 CPU 核心</td></tr><tr><td>C++20 协程</td><td>可暂停的函数执行状态</td><td>运行在线程上，由程序/库恢复</td></tr></tbody></table></section>
<footer>这是逻辑示意，不是实际内存布局或指令级追踪。示例只展示一个 CPU 执行位置；多核机器可同时执行多个线程。快捷键：← / → 单步，空格播放/暂停（焦点不在按钮或选择框时）。</footer>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const block=(title,value,hot=false)=>`<div class="block ${hot?'hot':''}"><strong>${esc(title)}</strong><div class="value">${esc(value)}</div></div>`;
const cpu=(owner,reg,idle=false)=>`<div class="cpu ${idle?'idle':''}"><strong>CPU 核心（仅画一个执行位置）：${esc(owner)}</strong><div class="reg">${esc(reg)}</div></div>`;
const thread=(name,status,stack,active=false)=>`<div class="thread ${active?'running':''} ${status.includes('等待')?'waiting':''}"><h4>${esc(name)} <span class="badge">${esc(status)}</span></h4><strong style="font-size:13px">线程栈 / 保存的现场</strong><div class="callstack">${esc(stack).replace(/\n/g,'<br>')}</div></div>`;
const scenes={
process:{
code:['// 两个独立启动的程序，都有自己的 counter','int counter = 0;','// 进程 A','++counter; // A 的 counter 变成 1','// OS 切换执行进程 B 的线程','++counter; // B 的 counter 变成 1','// A 再次获得 CPU','++counter; // A 的 counter 变成 2'],
note:'重点：每个进程框是“虚拟地址空间”，不是整块连续物理内存。相同虚拟地址可以映射到不同物理页；只读代码页也可能共享。这里是两个独立启动的进程，不是在演示 fork 的写时复制。进程切换实际是调度到另一个进程的线程；通常不复制整个内存。',
steps:[
{title:'两个程序，两个地址空间',text:'A 和 B 各有 counter、堆和线程栈。相同变量名，不代表同一个变量。此处把 counter 放在全局数据区。',a:0,b:0,who:'尚未选定',reg:'进程有资源；真正获得 CPU 执行的是线程。',line:1},
{title:'调度 A 的线程',text:'OS 让 A 的线程运行。CPU 使用 A 的地址转换环境，读取到的是 A 的 counter。',a:0,b:0,who:'进程 A / 线程 A1',reg:'地址空间 = A；执行位置 = ++counter 前',active:'A',line:3},
{title:'A 修改自己的数据',text:'A 把自己的 counter 从 0 改成 1。B 的 counter 没有变化。没有显式 IPC 或共享内存，两者不会自动同步。',a:1,b:0,who:'进程 A / 线程 A1',reg:'地址空间 = A；counter 写入完成',active:'A',hot:'A',line:3},
{title:'进入内核，保存 A 的现场',text:'这里假设调度时机到来。内核保存继续执行所需的寄存器、栈指针等状态。A 的数据仍留在内存中，不是被整体搬走。',a:1,b:0,who:'内核调度代码',reg:'保存 A 的执行现场 → 选择 B',line:4},
{title:'恢复 B，选择 B 的地址空间',text:'内核恢复 B 的现场，使用 B 的地址空间。跨地址空间可能增加 TLB 和缓存相关开销；不是每次清空全部缓存。',a:1,b:0,who:'进程 B / 线程 B1',reg:'地址空间 = B；执行位置 = ++counter 前',active:'B',line:5},
{title:'B 修改自己的数据',text:'B 的 counter 从 0 变成 1。A 的 counter 仍是 1。看起来都访问 counter，实际上属于不同地址空间。',a:1,b:1,who:'进程 B / 线程 B1',reg:'地址空间 = B；counter 写入完成',active:'B',hot:'B',line:5},
{title:'切回 A，继续原来的进度',text:'保存 B，恢复 A。A 不是重新从程序开头执行，而是从保存的位置继续；其 counter 再加一次，变成 2。',a:2,b:1,who:'进程 A / 线程 A1',reg:'地址空间 = A；从保存的执行位置继续',active:'A',hot:'A',line:7}
],
render(s){return cpu(s.who,s.reg)+`<div class="memory">${['A','B'].map(p=>`<div class="process ${s.active===p?'active':''}"><h3>进程 ${p} · 独立虚拟地址空间</h3><div class="address">相同地址数值 ≠ 相同物理内存</div>${block('代码 / 只读区','程序指令')}${block('全局数据区',`counter = ${p==='A'?s.a:s.b}`,s.hot===p)}${block('堆','动态分配的对象')}${thread('线程 '+p+'1',s.active===p?'运行':'就绪 / 保存现场','main() → 当前执行位置',s.active===p)}</div>`).join('')}</div>`;}
},
thread:{
code:['// 同一进程：A、B 共享 counter 和 mutex','int counter = 0;','// 每个线程各执行一次：','{','  std::lock_guard lock(mutex);','  ++counter;','} // 解锁','// main 在 join 后读到 counter == 2'],
note:'重点：线程共享进程的全局数据、堆等，但各有执行栈、寄存器现场和 TLS。这里用锁保证 counter 的读改写安全；单独的 ++counter 不是自动原子操作。阻塞加锁可能先短暂自旋再睡眠，具体取决于实现。本演示选择“B 阻塞并发生调度”的一条可能路径，不保证真实执行顺序。',
steps:[
{title:'同一个地址空间，两条执行流',text:'A、B 都能访问同一个 counter。各自的局部变量通常放在各自栈或寄存器中，但栈不是其他线程无法访问的安全边界。',n:0,owner:'无',a:'就绪',b:'就绪',who:'内核准备调度',reg:'共享地址空间 P；两个线程的现场各自保存',line:1},
{title:'A 先获得互斥锁',text:'A 的 lock_guard 构造成功，持有 mutex。B 之后如果也来加锁，不能同时进入受保护区域。',n:0,owner:'A',a:'运行',b:'就绪',who:'线程 A',reg:'地址空间 P；A 的栈指针、执行位置',hot:true,line:4},
{title:'A 持锁期间，CPU 切到 B',text:'假设 A 被抢占。OS 保存 A 的现场，恢复 B。同进程线程通常不用换地址空间；锁不会因为线程暂时没运行就自动释放。',n:0,owner:'A',a:'就绪（仍持锁）',b:'运行',who:'线程 B',reg:'地址空间仍是 P；换成 B 的执行栈与寄存器现场',line:4},
{title:'B 加锁失败，等待',text:'B 不能越过加锁这一行。这里演示 B 阻塞：内核登记等待，CPU 可以去执行 A 或其他可运行线程。',n:0,owner:'A',a:'就绪（仍持锁）',b:'等待 mutex',who:'内核调度代码',reg:'保存 B → 选择可运行的 A',line:4},
{title:'A 恢复，修改共享数据',text:'恢复 A 的栈和寄存器现场，不需要复制整份栈。A 继续持锁执行，把 counter 改成 1。B 暂时不能访问这个受保护区域。',n:1,owner:'A',a:'运行',b:'等待 mutex',who:'线程 A',reg:'继续 A 的 ++counter；共享 counter = 1',hot:true,line:5},
{title:'A 离开作用域，释放锁',text:'lock_guard 析构，释放 mutex。B 可以被唤醒并竞争锁；唤醒不代表立刻运行，也不保证一定由 B 下一个获得锁。',n:1,owner:'无',a:'结束',b:'就绪',who:'线程 A → 退出',reg:'A 的受保护操作完成',line:6},
{title:'B 获得锁并读取同一个 counter',text:'本路径中 B 恢复并获得锁。通过同一互斥锁的同步，它能看到 A 写入的 1，再加一次得到 2。',n:2,owner:'B',a:'结束',b:'运行',who:'线程 B',reg:'B 的执行现场；共享 counter = 2',hot:true,line:5},
{title:'两个线程完成',text:'B 解锁并结束。主线程 join 两个线程后读取 counter，结果为 2。线程退出和主线程 join 的细节在图中省略。',n:2,owner:'无',a:'结束',b:'结束',who:'主线程',reg:'join 完成后读取结果',line:7}
],
render(s){return cpu(s.who,s.reg)+`<div class="process active"><h3>进程 P · 同一个虚拟地址空间</h3>${block('共享：代码 / 全局数据 / 堆',`counter = ${s.n}\nmutex 持有者 = ${s.owner}`,s.hot)}<div class="thread-row">${thread('线程 A',s.a,s.a==='结束'?'执行结束':'worker_A()\nlock_guard A / 局部变量',s.a==='运行')}${thread('线程 B',s.b,s.b==='结束'?'执行结束':'worker_B()\nlock_guard B / 局部变量',s.b==='运行')}</div>${block('内核维护的线程状态（逻辑关联）','A：独立寄存器现场、调度状态\nB：独立寄存器现场、调度状态')}</div>`;}
},
coroutine:{
code:['// 伪代码：Task / async_read 由库提供','Task session(Socket socket) {','  int value = 10;','  auto data = co_await async_read(socket);','  value += data.size();','  co_return;','}','// loop：事件完成 → handle.resume()'],
note:'重点：这是 C++20 无栈协程 + 单线程事件循环的示意，不是有栈协程。协程帧常动态分配，也可能被优化消除分配；图中的堆框只是常见实现。帧不是完整线程栈，handle 本身不拥有帧。假设 Task 初始挂起、最终也挂起，并由唯一所有者销毁。async_read 可能内部多次尝试，只有操作完成才交付结果。',
steps:[
{title:'创建任务，不创建新线程',text:'创建 Task A、B，编译器建立各自协程帧，保存参数和 promise 等。此例采用 lazy start：initial_suspend 挂起，函数体尚未执行。',who:'事件循环 / 启动代码',reg:'唯一 OS 线程 T；没有新增 OS 线程',stack:'main() → 创建 Task A / B',a:{state:'初始挂起',pos:'函数体入口',value:'尚未构造'},b:{state:'初始挂起',pos:'函数体入口',value:'尚未构造'},queue:'就绪队列：[hA, hB]\n等待表：空',arrow:'Task A → hA → 帧 A；Task B → hB → 帧 B',line:1},
{title:'恢复 A，开始执行函数体',text:'事件循环调用 hA.resume()。当前线程进入编译器生成的恢复代码，在 A 帧中保留需要跨暂停点存活的 value。resume 不是提交后台线程。',who:'同一线程 T：执行协程 A',reg:'执行位置 = A 的函数体；使用帧 A',stack:'main() → loop.run()\n→ hA.resume() → A 恢复逻辑',a:{state:'执行中',pos:'发起异步读取',value:'10'},b:{state:'初始挂起',pos:'函数体入口',value:'尚未构造'},active:'A',queue:'就绪队列：[hB]\n等待表：空',arrow:'线程 T 读取帧 A；没有复制整个线程栈',line:2},
{title:'A 没数据：登记等待后挂起',text:'异步读取未完成。awaiter 登记 socket A 与 hA，协程挂起，resume 调用返回。value=10 和继续位置仍在帧内。这里不让整个线程阻塞等 A。',who:'同一线程 T：回到事件循环',reg:'A 的业务进度留在帧；线程继续执行循环',stack:'main() → loop.run()\nA 的恢复调用已返回',a:{state:'等待 I/O',pos:'读取完成后继续 co_await',value:'10'},b:{state:'初始挂起',pos:'函数体入口',value:'尚未构造'},queue:'就绪队列：[hB]\n等待表：socket A → hA',arrow:'awaiter.await_suspend(hA) → 保存等待关联',line:3},
{title:'同一线程恢复 B',text:'A 等待期间，线程可以执行 B。B 有自己的帧，value 与 A 互不覆盖。它们不是在这个 CPU 核心上同时计算，而是交替推进。',who:'同一线程 T：执行协程 B',reg:'执行位置 = B 的函数体；使用帧 B',stack:'main() → loop.run()\n→ hB.resume() → B 恢复逻辑',a:{state:'等待 I/O',pos:'读取完成后继续 co_await',value:'10'},b:{state:'执行中',pos:'发起异步读取',value:'10'},active:'B',queue:'就绪队列：空\n等待表：socket A → hA',arrow:'线程 T 转而访问帧 B；没有 OS 线程切换',line:2},
{title:'B 也挂起，循环等待事件',text:'B 也登记等待并返回。此时没有可运行任务，事件循环调用 epoll_wait。若没有事件，承载线程会阻塞，OS 可以调度其他线程。',who:'线程 T：epoll_wait 等待',reg:'此时可能发生 OS 线程上下文切换',stack:'main() → loop.run()\n→ epoll_wait()（阻塞）',idle:true,a:{state:'等待 I/O',pos:'读取完成后继续 co_await',value:'10'},b:{state:'等待 I/O',pos:'读取完成后继续 co_await',value:'10'},queue:'就绪队列：空\n等待表：socket A → hA；socket B → hB',arrow:'暂停的协程保留帧，不各自占用一个 OS 线程',line:3},
{title:'B 的事件先到，读取操作完成',text:'内核通知 socket B 就绪，epoll_wait 返回。运行库尝试读取，假设得到 3 字节并完成本次操作，再恢复 hB。内核不直接执行 C++ 的 handle.resume()。',who:'同一线程 T：事件循环',reg:'事件 B → 读取成功 → 查到 hB',stack:'main() → loop.run()\n→ 处理 B 的事件 / 读取结果',a:{state:'等待 I/O',pos:'读取完成后继续 co_await',value:'10'},b:{state:'等待结果已就绪',pos:'co_await 的 await_resume',value:'10'},queue:'就绪队列：[hB]\n等待表：socket A → hA',arrow:'OS 报告事件 → 运行库完成操作 → 安排恢复 B',line:7},
{title:'B 从暂停点继续，不重跑开头',text:'hB.resume() 继续 co_await，await_resume 交付 3 字节数据，然后 value 变成 13。不会再执行一次 value=10；A 的帧仍然保持 10。',who:'同一线程 T：执行协程 B',reg:'帧 B：value = 10 + 3 = 13',stack:'main() → loop.run()\n→ hB.resume() → B 恢复逻辑',a:{state:'等待 I/O',pos:'读取完成后继续 co_await',value:'10'},b:{state:'执行中',pos:'co_return 前',value:'13'},active:'B',queue:'就绪队列：空\n等待表：socket A → hA',arrow:'帧 B 的继续位置 → await_resume() → 后续业务',line:4},
{title:'B 完成，但帧还没有销毁',text:'B 执行 co_return，结束函数体局部对象的生命周期，并进入最终挂起。此例 done() 为 true；帧中的 promise 等仍保留，等待所有者销毁。图中 13 是刚结束前的历史值，不代表局部变量仍存活。',who:'同一线程 T：回到事件循环',reg:'B 已完成；不能再 resume 最终挂起的协程',stack:'main() → loop.run()',a:{state:'等待 I/O',pos:'读取完成后继续 co_await',value:'10'},b:{state:'最终挂起',pos:'final_suspend',value:'已结束（历史值 13）'},queue:'就绪队列：空\n等待表：socket A → hA',arrow:'完成 ≠ 销毁；B 帧仍由 Task B 拥有',line:5},
{title:'A 的操作完成，再恢复 A',text:'之后 A 的事件到来，假设读取到 5 字节。循环恢复 A，从自己的帧取回状态，value 从 10 加到 15。完成顺序可以与创建顺序不同。',who:'同一线程 T：执行协程 A',reg:'帧 A：value = 10 + 5 = 15',stack:'main() → loop.run()\n→ hA.resume() → A 恢复逻辑',a:{state:'执行中',pos:'co_return 前',value:'15'},b:{state:'最终挂起',pos:'final_suspend',value:'已结束（历史值 13）'},active:'A',queue:'就绪队列：空\n等待表：空',arrow:'不同协程的进度和局部数据分别保存在各自帧里',line:4},
{title:'全部完成，所有者释放帧',text:'A 也最终挂起。事件循环退出后，Task 所有者析构并调用 destroy，回收两个帧。使用任何遗留 handle 都不再安全。没有额外线程需要 join。',who:'同一线程 T：main / Task 析构',reg:'destroy(hA)、destroy(hB)；帧生命周期结束',stack:'main() → Task::~Task()\n→ handle.destroy()',a:{state:'帧已销毁',pos:'无有效继续位置',value:'存储已回收'},b:{state:'帧已销毁',pos:'无有效继续位置',value:'存储已回收'},gone:true,queue:'就绪队列：空\n等待表：空；所有者释放 handle',arrow:'先确保没有迟到恢复，再销毁帧',line:5}
],
render(s){const frame=(name,x)=>`<div class="frame ${s.active===name?'active':''} ${s.gone?'gone':''}"><h4>协程帧 ${name} <span class="badge">${esc(x.state)}</span></h4><div class="value">promise / 参数 / awaiter<br>继续位置：${esc(x.pos)}<br>value：${esc(x.value)}</div></div>`;return cpu(s.who,s.reg,s.idle)+`<div class="process active"><h3>一个进程 · 一个 OS 线程 T · 两个协程</h3>${thread('唯一线程 T',s.idle?'等待事件':'运行',s.stack,!s.idle)}<div class="arrow">${esc(s.arrow)}</div><div class="block"><strong>堆 / 持久存储：协程帧（常见实现）</strong><div class="frames">${frame('A',s.a)}${frame('B',s.b)}</div></div>${block('运行库的数据结构：队列、等待关联',s.queue)}<small>队列存 handle；线程执行时访问对应帧。图中的“继续位置”是概念状态，不规定 ABI。</small></div>`;}
}
};
let mode='process',index=0,timer=null;
function stop(){if(timer!==null){clearInterval(timer);timer=null;}$('play').textContent='▶ 自动播放';}
function render(){const scene=scenes[mode],s=scene.steps[index];$('visual').innerHTML=scene.render(s);$('explain').innerHTML=`<h2>${esc(s.title)}</h2><p>${esc(s.text)}</p>`;$('code').innerHTML=scene.code.map((line,i)=>`<span class="${i===s.line?'current':'line'}">${esc(line)}</span>`).join('');$('note').textContent=scene.note;$('count').textContent=`${index+1} / ${scene.steps.length}`;$('prev').disabled=index===0;$('next').disabled=index===scene.steps.length-1;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.mode===mode)));$('timeline').innerHTML=scene.steps.map((x,i)=>`<button class="tick ${i===index?'now':i<index?'past':''}" data-step="${i}" title="${esc(x.title)}" aria-label="第 ${i+1} 步：${esc(x.title)}" ${i===index?'aria-current="step"':''}></button>`).join('');}
function move(delta){stop();index=Math.max(0,Math.min(scenes[mode].steps.length-1,index+delta));render();}
function play(){if(timer!==null){stop();return;}if(index===scenes[mode].steps.length-1){index=0;render();}$('play').textContent='⏸ 暂停';timer=setInterval(()=>{if(index<scenes[mode].steps.length-1){index++;render();}if(index===scenes[mode].steps.length-1)stop();},Number($('speed').value));}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{stop();mode=b.dataset.mode;index=0;render();}));$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('play').onclick=play;$('reset').onclick=()=>{stop();index=0;render();};$('speed').onchange=()=>{if(timer!==null){stop();play();}};$('timeline').onclick=e=>{const b=e.target.closest('[data-step]');if(b){stop();index=Number(b.dataset.step);render();}};
document.addEventListener('keydown',e=>{if(e.target.closest('button,select,input,textarea'))return;if(e.key==='ArrowRight'){e.preventDefault();move(1);}else if(e.key==='ArrowLeft'){e.preventDefault();move(-1);}else if(e.code==='Space'){e.preventDefault();play();}});render();
</script>
